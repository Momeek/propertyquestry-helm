apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.client.name }}
  labels:
    app: {{ .Values.client.name }}
spec:
  replicas: {{ .Values.client.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.client.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.client.name }}
    spec:
      {{- if and .Values.dockerregistry.enabled .Values.dockerregistry.username .Values.dockerregistry.password }}
      imagePullSecrets:
        - name: {{ .Values.dockerregistry.name }}
      {{- end }}
      {{- if .Values.initcontainers.enabled }}
      initContainers:
        - name: init-mydb
          image: {{ .Values.initcontainers.image }}
          command:
            - sh
            - -c
            - |
              until nslookup mysql.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for propertydb-service; sleep 2; done
        - name: init-server
          image: {{ .Values.initcontainers.image }}
          command:
            - sh
            - -c
            - |
              until nslookup propertyserver-service.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for propertyserver-service; sleep 2; done
      {{- end }}
      containers:
        - name: propertyquest-client-container
          image: {{ .Values.client.image }}:{{ .Values.client.tag | default "latest" }}
          ports:
            - containerPort: {{ .Values.client.containerPort }}
              name: client-port
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "http://localhost:8080/api"
